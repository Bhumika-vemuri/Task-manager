services:
  - type: web
    name: task-manager-web-app
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9